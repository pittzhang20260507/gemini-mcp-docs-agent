[project]
name = "gemini-mcp-docs-agent"
version = "0.1.0"
description = "Gemini agent that answers infrastructure questions only from official docs, via an MCP tool backed by Vertex AI Search."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["mcp>=2.0", "google-genai>=1.20", "google-auth>=2.30", "requests>=2.31"]

[project.scripts]
docs-mcp-server = "docs_agent.server:main"
docs-agent = "docs_agent.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docs_agent"]
